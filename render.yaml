services:
  - type: web
    name: simple-payroll-system
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: 80
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_SSL
        value: true
